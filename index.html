<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포토카드 피킹 더블체크 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Excel 파싱) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coral: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-coral-500 text-white p-2 rounded-xl shadow-sm">
                    <i data-lucide="scan-line" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-lg sm:text-xl flex items-center gap-2">
                        포토카드 피킹 더블체크 시스템
                        <span id="titleUid" class="hidden text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-semibold border border-slate-200">
                            UID: <span id="uidValue" class="text-coral-600"></span>
                        </span>
                    </h1>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- Sound Toggle -->
                <button id="soundToggle" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition">
                    <i data-lucide="volume-2" class="w-4 h-4 text-coral-600" id="soundIcon"></i>
                    <span id="soundText">소리 켜짐</span>
                </button>
                <!-- Reset Button -->
                <button id="resetBtn" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100 transition hidden">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    초기화
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">

        <!-- File Upload Section -->
        <div id="uploadSection" class="bg-white rounded-2xl border-2 border-dashed border-slate-300 p-8 text-center hover:border-coral-500 transition cursor-pointer shadow-sm my-auto">
            <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" class="hidden">
            <div class="max-w-md mx-auto flex flex-col items-center">
                <div class="w-16 h-16 bg-coral-50 rounded-2xl flex items-center justify-center text-coral-500 mb-4">
                    <i data-lucide="file-spreadsheet" class="w-8 h-8"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">엑셀 리스트 업로드</h2>
                <p class="text-sm text-slate-500 mb-6">
                    피킹 검수할 엑셀 파일(.xlsx, .xls)을 드래그하거나 클릭하여 업로드하세요.
                </p>
                <button onclick="document.getElementById('excelInput').click()" class="px-6 py-2.5 bg-coral-500 hover:bg-coral-600 text-white font-semibold rounded-xl shadow-md transition flex items-center gap-2">
                    <i data-lucide="upload" class="w-4 h-4"></i>
                    파일 선택하기
                </button>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="hidden flex-1 flex flex-col gap-6">
            
            <!-- Top Controls -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                
                <!-- Barcode Input Box -->
                <div class="md:col-span-2 bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div class="flex items-center justify-between mb-2">
                        <label for="barcodeInput" class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
                            <i data-lucide="barcode" class="w-4 h-4 text-coral-500"></i>
                            바코드 스캔 입력
                        </label>
                        <span class="text-xs text-slate-400">엔터(Enter) 입력 시 즉시 검수</span>
                    </div>
                    <div class="relative">
                        <input type="text" id="barcodeInput" placeholder="바코드를 스캔하세요 (예: AA06_214749)..." autofocus
                            class="w-full pl-4 pr-12 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl font-mono text-lg font-bold text-slate-800 focus:outline-none focus:border-coral-500 focus:bg-white transition shadow-inner">
                        <button id="submitBarcodeBtn" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 bg-coral-500 text-white rounded-lg hover:bg-coral-600 transition">
                            <i data-lucide="corner-down-left" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <!-- Feedback Status Message -->
                    <div id="feedbackMessage" class="mt-3 min-h-[28px] text-sm font-semibold flex items-center gap-2 px-3 py-1 rounded-lg bg-slate-50 text-slate-500">
                        <i data-lucide="info" class="w-4 h-4"></i>
                        <span>바코드를 스캔하면 수량이 자동으로 변경됩니다.</span>
                    </div>
                </div>

                <!-- Progress Counter Card -->
                <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">검수 진행률</span>
                        <span id="progressPercent" class="text-xs font-extrabold text-coral-600 bg-coral-50 px-2 py-0.5 rounded-full">0%</span>
                    </div>
                    
                    <div class="my-2">
                        <div class="flex items-baseline justify-between mb-1">
                            <span id="checkedCount" class="text-3xl font-black text-slate-800">0</span>
                            <span class="text-slate-400 font-medium">/ <span id="totalCount">0</span> 개 완료</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                            <div id="progressBar" class="bg-coral-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between text-xs text-slate-500 pt-2 border-t border-slate-100">
                        <span>미검수: <strong id="remainingCount" class="text-slate-700">0</strong></span>
                        <span id="completeBadge" class="hidden text-emerald-600 font-bold flex items-center gap-1">
                            <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> 검수 완료!
                        </span>
                    </div>
                </div>
            </div>

            <!-- Table Card -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm flex-1 flex flex-col overflow-hidden">
                <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                    <h3 class="font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="list" class="w-4 h-4 text-coral-500"></i>
                        포토카드 리스트
                    </h3>
                    <div class="flex items-center gap-2">
                        <input type="text" id="searchInput" placeholder="검색어 입력..." class="px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-coral-500">
                    </div>
                </div>

                <div class="flex-1 overflow-auto custom-scrollbar">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead class="bg-slate-50 text-slate-500 font-semibold text-xs uppercase tracking-wider sticky top-0 border-b border-slate-200 z-10">
                            <tr>
                                <th class="py-3.5 px-4 w-16 text-center">No.</th>
                                <th class="py-3.5 px-4">컬렉션 번호</th>
                                <th class="py-3.5 px-4">입고 번호</th>
                                <th class="py-3.5 px-4">포토카드 ID</th>
                                <th class="py-3.5 px-4 w-32 text-center">확인 상태</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-100 font-medium">
                            <!-- Dynamic Content -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        let excelData = [];
        let isSoundEnabled = true;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSuccessSound() {
            if (!isSoundEnabled) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
            osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playErrorSound() {
            if (!isSoundEnabled) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        lucide.createIcons();

        document.getElementById('excelInput').addEventListener('change', handleFileUpload);
        document.getElementById('barcodeInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') processBarcode();
        });
        document.getElementById('submitBarcodeBtn').addEventListener('click', processBarcode);
        document.getElementById('resetBtn').addEventListener('click', resetApp);
        document.getElementById('soundToggle').addEventListener('click', toggleSound);
        document.getElementById('searchInput').addEventListener('input', renderTable);

        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            const soundIcon = document.getElementById('soundIcon');
            const soundText = document.getElementById('soundText');
            if (isSoundEnabled) {
                soundIcon.setAttribute('data-lucide', 'volume-2');
                soundIcon.className = 'w-4 h-4 text-coral-600';
                soundText.innerText = '소리 켜짐';
            } else {
                soundIcon.setAttribute('data-lucide', 'volume-x');
                soundIcon.className = 'w-4 h-4 text-slate-400';
                soundText.innerText = '음소거';
            }
            lucide.createIcons();
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const match = file.name.match(/\d+/);
            if (match) {
                document.getElementById('uidValue').innerText = match[0];
                document.getElementById('titleUid').classList.remove('hidden');
            }

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    if (jsonData.length < 2) {
                        alert('올바른 데이터가 포함된 엑셀 파일을 업로드해주세요.');
                        return;
                    }

                    parseData(jsonData);
                } catch (err) {
                    alert('파일을 읽는 중 오류가 발생했습니다.');
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function parseData(rows) {
            excelData = [];
            const headers = rows[0].map(h => String(h || '').trim());
            
            let collectionIdx = 0, shippingIdx = 1, memberCodeIdx = -1, photoCardIdx = -1, combinedIdx = -1;

            headers.forEach((h, idx) => {
                if (h.includes('id') || h.includes('컬렉션')) collectionIdx = idx;
                if (h.includes('입고')) shippingIdx = idx;
                if (h.includes('그룹') || h.includes('멤버')) memberCodeIdx = idx;
                if (h.includes('포토카드') || h.includes('카드')) photoCardIdx = idx;
                if (h.includes('MemberCode_ID') || h.includes('조합')) combinedIdx = idx;
            });

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length === 0) continue;

                let collectionNo = row[collectionIdx] !== undefined ? String(row[collectionIdx]).trim() : '';
                let shippingNo = row[shippingIdx] !== undefined ? String(row[shippingIdx]).trim() : '';
                let photoCardId = '';

                // 분리형 및 결합형 단일 로직 적용 (중복 생성 방지)
                if (combinedIdx !== -1 && row[combinedIdx]) {
                    photoCardId = String(row[combinedIdx]).trim();
                } else if (memberCodeIdx !== -1 && photoCardIdx !== -1 && row[memberCodeIdx] !== undefined && row[photoCardIdx] !== undefined) {
                    photoCardId = `${String(row[memberCodeIdx]).trim()}_${String(row[photoCardIdx]).trim()}`;
                } else if (row[2] !== undefined && row[3] !== undefined) {
                    photoCardId = `${String(row[2]).trim()}_${String(row[3]).trim()}`;
                } else if (row[2] !== undefined) {
                    photoCardId = String(row[2]).trim();
                }

                if (photoCardId && photoCardId !== '_') {
                    excelData.push({
                        id: i,
                        collectionNo: collectionNo,
                        shippingNo: shippingNo,
                        photoCardId: photoCardId,
                        checked: false
                    });
                }
            }

            if (excelData.length === 0) {
                alert('엑셀 파일에서 포토카드 데이터를 찾을 수 없습니다.');
                return;
            }

            document.getElementById('uploadSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('resetBtn').classList.remove('hidden');

            renderTable();
            updateProgress();
            document.getElementById('barcodeInput').focus();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const search = document.getElementById('searchInput').value.toLowerCase();
            tbody.innerHTML = '';

            const filteredData = excelData.filter(item => 
                item.collectionNo.toLowerCase().includes(search) ||
                item.shippingNo.toLowerCase().includes(search) ||
                item.photoCardId.toLowerCase().includes(search)
            );

            filteredData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = item.checked 
                    ? 'bg-emerald-50/60 text-slate-600 transition hover:bg-emerald-100/50' 
                    : 'hover:bg-slate-50 transition';

                tr.innerHTML = `
                    <td class="py-3 px-4 text-center text-xs text-slate-400 font-mono">${index + 1}</td>
                    <td class="py-3 px-4 text-slate-800 font-semibold">${item.collectionNo || '-'}</td>
                    <td class="py-3 px-4 text-slate-600 font-mono text-xs">${item.shippingNo || '-'}</td>
                    <td class="py-3 px-4 font-mono font-bold ${item.checked ? 'text-emerald-700' : 'text-coral-600'}">${item.photoCardId}</td>
                    <td class="py-3 px-4 text-center">
                        ${item.checked 
                            ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700 border border-emerald-200">
                                <i data-lucide="check" class="w-3 h-3"></i> 확인완료
                               </span>`
                            : `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-500">
                                대기중
                               </span>`
                        }
                    </td>
                `;
                tbody.appendChild(tr);
            });

            lucide.createIcons();
        }

        function processBarcode() {
            const inputEl = document.getElementById('barcodeInput');
            const barcode = inputEl.value.trim();
            const feedbackEl = document.getElementById('feedbackMessage');

            if (!barcode) return;

            const targetIndex = excelData.findIndex(item => item.photoCardId === barcode && !item.checked);

            if (targetIndex !== -1) {
                excelData[targetIndex].checked = true;
                playSuccessSound();

                feedbackEl.className = 'mt-3 min-h-[28px] text-sm font-semibold flex items-center gap-2 px-3 py-1 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200';
                feedbackEl.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4 text-emerald-600"></i>
                    <span>[확인 성공] ${barcode} 번호가 성공적으로 수량 확인되었습니다!</span>`;

                renderTable();
                updateProgress();
            } else {
                const alreadyChecked = excelData.some(item => item.photoCardId === barcode && item.checked);
                playErrorSound();

                if (alreadyChecked) {
                    feedbackEl.className = 'mt-3 min-h-[28px] text-sm font-semibold flex items-center gap-2 px-3 py-1 rounded-lg bg-amber-50 text-amber-700 border border-amber-200';
                    feedbackEl.innerHTML = `<i data-lucide="alert-triangle" class="w-4 h-4 text-amber-600"></i>
                        <span>[주의] ${barcode} 번호는 이미 확인 완료된 바코드입니다.</span>`;
                } else {
                    feedbackEl.className = 'mt-3 min-h-[28px] text-sm font-semibold flex items-center gap-2 px-3 py-1 rounded-lg bg-rose-50 text-rose-700 border border-rose-200';
                    feedbackEl.innerHTML = `<i data-lucide="x-circle" class="w-4 h-4 text-rose-600"></i>
                        <span>[불일치] 리스트에 없는 바코드입니다: ${barcode}</span>`;
                }
            }

            lucide.createIcons();
            inputEl.value = '';
            inputEl.focus();
        }

        function updateProgress() {
            const total = excelData.length;
            const checked = excelData.filter(i => i.checked).length;
            const percent = total > 0 ? Math.round((checked / total) * 100) : 0;

            document.getElementById('totalCount').innerText = total;
            document.getElementById('checkedCount').innerText = checked;
            document.getElementById('remainingCount').innerText = total - checked;
            document.getElementById('progressPercent').innerText = `${percent}%`;
            document.getElementById('progressBar').style.width = `${percent}%`;

            if (total > 0 && checked === total) {
                document.getElementById('completeBadge').classList.remove('hidden');
            } else {
                document.getElementById('completeBadge').classList.add('hidden');
            }
        }

        function resetApp() {
            if (confirm('현재 진행 상황을 초기화하시겠습니까?')) {
                excelData = [];
                document.getElementById('excelInput').value = '';
                document.getElementById('barcodeInput').value = '';
                document.getElementById('dashboardSection').classList.add('hidden');
                document.getElementById('uploadSection').classList.remove('hidden');
                document.getElementById('resetBtn').classList.add('hidden');
                document.getElementById('titleUid').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
